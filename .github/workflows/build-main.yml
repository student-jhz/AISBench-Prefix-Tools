name: Build EXE (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE (PyInstaller)
        run: pyinstaller --noconfirm --onefile --windowed --name "AISBench-Prefix-Tools" --icon=app.ico --add-data "requirements.txt;." --add-data "app.ico;." --add-data "aisbench_auto_tools_prefix;aisbench_auto_tools_prefix" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISBench-Prefix-Tools-exe-${{ github.sha }}
          path: dist/AISBench-Prefix-Tools.exe
          retention-days: 90
          if-no-files-found: error
